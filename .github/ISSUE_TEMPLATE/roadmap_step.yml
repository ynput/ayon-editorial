name: Roadmap step
description: A step of the editorial roadmap. Normally generated from .github/roadmap.yml.
title: "[Editorial P?.?]: "
labels: ["roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        Steps are generated by `tools/roadmap_sync.py` from
        `.github/roadmap.yml`. Prefer editing the manifest. Use this form
        only for a step not yet in the manifest, then add it there.
  - type: input
    id: step_id
    attributes:
      label: Step ID
      description: Phase and number, for example `P2.3`.
      placeholder: P2.3
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What changes, with file paths.
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Step IDs or issue numbers.
      placeholder: "- P2.1"
  - type: dropdown
    id: target_repo
    attributes:
      label: Target repo
      options:
        - ayon-editorial
        - ayon-flame
        - ayon-hiero
        - ayon-resolve
        - ayon-traypublisher
        - ayon-core
        - ayon-unreal
        - ayon-deadline
    validations:
      required: true

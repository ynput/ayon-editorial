  - id: P6
    phase: P6 Creator parity
    title: Creator feature parity between hosts
    goal: >-
      With the creator framework shared, give every host the features only
      one host has today. Each issue starts with a short research note on
      what the host API allows.
    release: 0.6.0
    steps:
      - id: P6.1
        title: Include handles, retimed handles and retimed frame range in Hiero and Resolve
        kind: Parity
        repos: [ayon-hiero, ayon-resolve]
        tier: standard
        priority: Medium
        depends: [P3.5, P3.6]
        goal: "Flame-only options `includeHandles`, `retimedHandles`, `retimedFramerange`."
        refs:
          - "ynput/ayon-flame#28: why retimed handles exist"

      - id: P6.2
        title: Review track regex pattern in Flame and Resolve
        kind: Parity
        repos: [ayon-flame, ayon-resolve]
        tier: standard
        priority: Medium
        depends: [P3.6, P3.7]
        goal: "Hiero-only option `reviewTrackRegexPattern`."

      - id: P6.3
        title: Shot task assignment in Hiero and Resolve
        kind: Parity
        repos: [ayon-hiero, ayon-resolve]
        tier: standard
        priority: Medium
        depends: [P3.5, P3.6]
        goal: "Flame-only task assignment (`add_tasks`)."
        refs:
          - "ynput/ayon-traypublisher#198: available tasks as a creator attribute"

      - id: P6.4
        title: Use shot name and segment index in Hiero and Resolve
        kind: Parity
        repos: [ayon-hiero, ayon-resolve]
        tier: standard
        priority: Low
        depends: [P3.5, P3.6]
        goal: "Flame-only options `useShotName` and `segmentIndex`."

      - id: P6.5
        title: Resolve clip selection without clip colour
        kind: Parity
        repos: [ayon-resolve]
        tier: standard
        priority: Low
        depends: [P3.6]
        goal: >-
          Resolve marks "selected" clips with the Chocolate clip colour because
          its scripting API exposes no clip selection. Use a real selection if a
          supported Resolve version allows it; otherwise document the limit.
        refs:
          - "ynput/ayon-resolve#123: setting to turn off the Chocolate filter"

      - id: P6.6
        title: Shared parsing of attributes from clip comments
        kind: Parity
        repos: [ayon-flame, ayon-hiero, ayon-resolve]
        tier: standard
        priority: Low
        depends: [P3.4]
        goal: One parser for creator attributes written in clip comments, used by every host.

      - id: P6.7
        title: Publish Hiero soft effects from Flame and Resolve, where possible
        kind: Parity
        repos: [ayon-flame, ayon-resolve]
        tier: standard
        priority: Low
        depends: [P3.6, P3.7]
        goal: >-
          Hiero-only `publish_effects`. Research first whether Flame and Resolve
          expose comparable effects; close as not possible otherwise.

  - id: P7
    phase: P7 Release and future
    title: Release and later work
    goal: First stable release, then the moves and ideas kept on the roadmap.
    release: 1.0.0
    steps:
      - id: P7.1
        title: Release workflow and 1.0.0
        kind: Infra
        tier: human
        priority: High
        depends: [P0.4]
        goal: Release `ayon-editorial` like other ynput addons.
        scope:
          - "`release_trigger` and `upload_to_ynput_cloud` workflows"
          - Documentation
          - Add an editorial note to each host repo's `AGENTS.md`
        acceptance:
          - "[ ] Released on ynput cloud and installable in a bundle with Flame, Hiero, Resolve and Traypublisher"

      - id: P7.2
        title: Move ayon-core's OTIO publish plugins into ayon-editorial
        kind: Decision
        repo: ayon-core
        tier: deep
        priority: Low
        depends: [P5.1]
        goal: >-
          Planned at low priority. ayon-core keeps its OTIO publish plugins
          and `pipeline/editorial.py` until this step. Decide how to move them
          without breaking hosts that do not depend on `editorial` yet.
        scope:
          - "Inventory: the collect/extract OTIO plugins in `client/ayon_core/plugins/publish/` and `client/ayon_core/pipeline/editorial.py`"
          - Deprecation path and the core version that drops them

      - id: P7.3
        title: Timeline publishing from Unreal with the shared builder
        kind: Research
        repo: ayon-unreal
        tier: deep
        priority: Low
        depends: [P2.6]
        goal: "Unreal has no OTIO code today, only LevelSequences. Research publishing a LevelSequence as an OTIO timeline with `otio/builder.py`."

      - id: P7.4
        title: Editorial rendering on the farm with ayon-deadline
        kind: Research
        repo: ayon-deadline
        tier: deep
        priority: Very low
        depends: [P2.6]
        goal: >-
          To consider, not planned. Design only: run editorial extraction
          headless on a farm. Layer 0 already works on files and OTIO objects,
          not host objects, so a farm job can call it.

      - id: P7.5
        title: Review tools adopting the shared timeline builder
        kind: Research
        tier: deep
        priority: Very low
        depends: [P2.6]
        goal: >-
          To consider, not planned. AYON review tools that build OTIO
          timelines could use `otio/builder.py` instead of their own code.
